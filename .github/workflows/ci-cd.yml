name: CI/CD

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy this branch after tests pass (see docs/DEPLOYMENT.md)"
        type: choice
        options: [none, app]
        default: none

jobs:
  test-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: poeflipfinder
          POSTGRES_PASSWORD: poeflipfinder
          POSTGRES_DB: poe_flip_finder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poeflipfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - uses: actions/cache@v4
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('app/mix.lock') }}
      - run: mix deps.get
      # Day-one enforcement (docs/CODE_STYLE.md): a boundary violation is a
      # compiler warning by default -- --warnings-as-errors is what actually
      # turns the Dependency Rule into a build failure, not just local-only
      # prose.
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # Runs automatically on a push to main, or on demand from any branch via
  # workflow_dispatch (Actions tab -> Run workflow -> pick branch +
  # deploy_target: app) -- either way, only if test-app passed. Render's own
  # git-triggered auto-deploy is turned OFF in its dashboard (see
  # docs/DEPLOYMENT.md), so this is the *only* path to a deploy -- a failing
  # test can never reach production, automatic or manual. There is only one
  # Render site; a manual deploy from a non-main branch ships that branch's
  # code to it.
  deploy-app:
    needs: test-app
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'app')
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
