spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: filesystem:../db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  ingestion:
    max-hours-per-call: ${INGESTION_MAX_HOURS_PER_CALL:48}
    first-run-lookback-hours: ${INGESTION_FIRST_RUN_LOOKBACK_HOURS:24}
