openapi: 3.0.3
info:
  title: PoE Currency Exchange Flip Finder API
  version: 0.1.0
  description: >
    The single source of truth for the frontend/backend contract. Both apps
    generate code from this file -- see docs/ARCHITECTURE.md § API Contract.
    Edit this file first when adding or changing an endpoint; regenerate
    both sides afterward.

servers:
  - url: /api

paths:
  /leagues:
    get:
      operationId: getLeagues
      summary: List leagues available for the Feature D league selector
      tags: [Leagues]
      responses:
        "200":
          description: Leagues with Currency Exchange activity, SSF leagues excluded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"

  /exchange-ingestion/refresh:
    post:
      operationId: refreshExchangeIngestion
      summary: >
        Manually trigger one bounded catch-up walk of Currency Exchange
        ingestion (docs/ARCHITECTURE.md § Currency Exchange Ingestion).
        Capped per call -- if the app has been stale a while, one call may
        only make partial progress; call again to continue.
      tags: [ExchangeIngestion]
      responses:
        "200":
          description: One bounded call completed (fully caught up, or partial -- call again to continue)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRefreshResult"

  /exchange-ingestion/freshness:
    get:
      operationId: getExchangeIngestionFreshness
      summary: Read-only ingestion checkpoint/staleness state (Feature F)
      tags: [ExchangeIngestion]
      responses:
        "200":
          description: Current ingestion state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionFreshness"

  /flip-opportunities:
    get:
      operationId: getFlipOpportunities
      summary: >
        Compute flip opportunities for a league (docs/PRD.md § 7.2 -- V1 is
        Exchange Spread only; the schema is shared/generic so Features A/C/E
        can add rows of other techniques later without a breaking change).
        Unsorted -- client-side sort/filter is a separate, not-yet-built
        frontend feature (docs/PRD.md § 7.9).
      tags: [FlipOpportunities]
      parameters:
        - name: league
          in: query
          required: true
          schema:
            type: string
          description: League external id (e.g. "Allflame"), as returned by GET /leagues
      responses:
        "200":
          description: Computed flip opportunities for the requested league
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlipOpportunity"

components:
  schemas:
    League:
      type: object
      required: [id, name, isDefault]
      properties:
        id:
          type: string
          description: GGG's league id, e.g. "Allflame"
        name:
          type: string
        isDefault:
          type: boolean
          description: True for the current mainline challenge league (docs/PRD.md § 7.4)
    IngestionRefreshResult:
      type: object
      required: [hoursProcessed, fullyCaughtUp, skippedUnresolvableMarketEntryCount]
      properties:
        hoursProcessed:
          type: integer
        fullyCaughtUp:
          type: boolean
          description: False means the per-call hour cap was reached before reaching the current hour; call again to continue.
        lastProcessedChangeId:
          type: integer
          format: int64
          nullable: true
        skippedUnresolvableMarketEntryCount:
          type: integer
          description: >
            Distinct currency pairs skipped this call because a currency in
            the pair couldn't be resolved even via Item Icons -- deduplicated
            across the hours walked, not a raw per-hour occurrence count
            (the same unresolvable pair recurs in most hours it's active).
    IngestionFreshness:
      type: object
      properties:
        lastProcessedChangeId:
          type: integer
          format: int64
          nullable: true
        activeGenerationRefreshedAt:
          type: string
          format: date-time
          nullable: true
          description: Null if ingestion has never completed a successful run.
    CurrencyAmount:
      type: object
      required: [currencyId, name, itemType, quantity]
      properties:
        currencyId:
          type: string
          description: The currency's external id, e.g. "Metadata/Items/Currency/CurrencyRerollRare"
        name:
          type: string
        iconUrl:
          type: string
          nullable: true
          description: Always null for divination cards -- GGG's Item Icons data exposes no image for them (docs/DATA_SOURCES.md). Clients render a generic card-suit icon in that case.
        itemType:
          type: string
          enum: [CURRENCY, DIVINATION_CARD]
        quantity:
          type: number
          format: double
    FlipOpportunity:
      type: object
      required: [technique, start, via, sell, marginPercent, profit, volume, detail]
      properties:
        technique:
          type: string
          enum: [VENDOR_RECIPE, EXCHANGE_SPREAD, DIVINATION_CARD, BULK_BUY]
        start:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyAmount"
        via:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyAmount"
        sell:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyAmount"
        marginPercent:
          type: number
          format: double
        profit:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: Always denominated in Chaos Orb, regardless of the start currency -- see docs/TECH_STACK.md's row design and docs/PRD.md § 7.2.
        volume:
          type: number
          format: double
        detail:
          type: string
          description: Free-text caveat/explanation, e.g. the instant-vs-competitive rates for Exchange Spread.
