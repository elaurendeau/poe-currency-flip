services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: poeflipfinder
      POSTGRES_USER: poeflipfinder
      POSTGRES_PASSWORD: poeflipfinder
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poeflipfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/poeflipfinder?user=poeflipfinder&password=poeflipfinder
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
