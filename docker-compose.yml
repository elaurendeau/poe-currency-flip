services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: poeflipfinder
      POSTGRES_USER: poeflipfinder
      POSTGRES_PASSWORD: poeflipfinder
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poeflipfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
